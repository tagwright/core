# Baseline CI for core: build, vet, and unit tests on the hosted runner. core is
# a library (the suite's runtime abstraction), so there is no image and no
# release job here, and no self-hosted leg: the unit suite needs no Docker
# socket. core has no tagwright module dependencies, so GOPRIVATE is not needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
